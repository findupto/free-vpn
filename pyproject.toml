[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "findupto-vpn"
version = "14.0.0"
description = "A defensive, lightweight VPN client with live public-server discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
