name: Windows Desktop Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build desktop EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FinduptoVPN client/app.py

      - name: Download official VPN runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -Uri 'https://download.wireguard.com/windows-client/wireguard-amd64-1.0.1.msi' -OutFile 'installer/wireguard-amd64.msi' -ErrorAction Stop } catch { curl.exe --fail --location --retry 3 -o 'installer/wireguard-amd64.msi' 'https://download.wireguard.com/windows-client/wireguard-amd64-1.0.1.msi' }
          try { Invoke-WebRequest -UseBasicParsing -Uri 'https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.5-I001-amd64.msi' -OutFile 'installer/openvpn-amd64.msi' -ErrorAction Stop } catch { curl.exe --fail --location --retry 3 -o 'installer/openvpn-amd64.msi' 'https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.5-I001-amd64.msi' }
          if ((Get-Item 'installer/wireguard-amd64.msi').Length -lt 100000) { throw 'WireGuard MSI download is invalid' }
          if ((Get-Item 'installer/openvpn-amd64.msi').Length -lt 1000000) { throw 'OpenVPN MSI download is invalid' }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build standalone installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/FinduptoVPN.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'installer/dist/Findupto-Free-VPN-Setup.exe')) { throw 'Installer was not created' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Findupto-Free-VPN-Windows
          path: installer/dist/Findupto-Free-VPN-Setup.exe

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/Findupto-Free-VPN-Setup.exe
          generate_release_notes: true
