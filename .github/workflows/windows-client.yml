name: Windows Desktop Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build resilient desktop EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths client --name FinduptoVPN client/launcher.py

      - name: Download official OpenVPN runtime with fallback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $urls = @(
            'https://build.openvpn.net/downloads/releases/latest/openvpn-latest-stable-amd64.msi',
            'https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.5-I001-amd64.msi',
            'https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.4-I002-amd64.msi'
          )
          $out = Join-Path $PWD 'installer/openvpn-amd64.msi'
          foreach ($u in $urls) {
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            try {
              curl.exe --fail --silent --show-error --location --connect-timeout 8 --max-time 60 -A 'Findupto-Free-VPN-Build/5.0' -o $out $u
              if ($LASTEXITCODE -eq 0 -and (Get-Item $out).Length -gt 4000000) { break }
            } catch {}
          }
          if (!(Test-Path $out) -or (Get-Item $out).Length -le 4000000) { throw 'Could not download an official OpenVPN MSI.' }

      - name: Build standalone installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/FinduptoVPN.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'installer/dist/Findupto-Free-VPN-Setup.exe')) { throw 'Installer was not created' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Findupto-Free-VPN-Windows-5.0.0
          path: installer/dist/Findupto-Free-VPN-Setup.exe

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/Findupto-Free-VPN-Setup.exe
          generate_release_notes: true
