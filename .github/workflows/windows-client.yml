name: Windows Desktop Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt

      - name: Build desktop EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FinduptoVPN client/app.py

      - name: Download official WireGuard MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-1.0.1.msi" -OutFile "installer/wireguard-amd64.msi"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build standalone installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/FinduptoVPN.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Findupto-Free-VPN-Windows
          path: installer/dist/Findupto-Free-VPN-Setup.exe

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/Findupto-Free-VPN-Setup.exe
          generate_release_notes: true
