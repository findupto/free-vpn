name: Windows Desktop Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build desktop EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FinduptoVPN client/app.py

      - name: Download official VPN runtimes with fallback methods
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $ProgressPreference='SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          function Get-Fallback($urls,$out) {
            foreach ($u in $urls) {
              try { Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile $out -ErrorAction Stop; if ((Get-Item $out).Length -gt 100000) { return } } catch {}
              try { curl.exe --fail --location --retry 4 --retry-all-errors --connect-timeout 10 -o $out $u; if ($LASTEXITCODE -eq 0 -and (Get-Item $out).Length -gt 100000) { return } } catch {}
              try { Start-BitsTransfer -Source $u -Destination $out -ErrorAction Stop; if ((Get-Item $out).Length -gt 100000) { return } } catch {}
            }
            throw "All download methods failed for $out"
          }
          Get-Fallback @('https://download.wireguard.com/windows-client/wireguard-amd64-1.0.1.msi') 'installer/wireguard-amd64.msi'
          Get-Fallback @('https://build.openvpn.net/downloads/releases/latest/openvpn-latest-stable-amd64.msi','https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.5-I001-amd64.msi','https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.4-I002-amd64.msi','https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.22-I001-amd64.msi') 'installer/openvpn-amd64.msi'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build standalone installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/FinduptoVPN.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'installer/dist/Findupto-Free-VPN-Setup.exe')) { throw 'Installer was not created' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Findupto-Free-VPN-Windows
          path: installer/dist/Findupto-Free-VPN-Setup.exe

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/Findupto-Free-VPN-Setup.exe
          generate_release_notes: true
