name: Build Windows VPN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: python -m pip install --upgrade -r client/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q client tests

      - name: Import application modules
        run: python -c "import sys; sys.path.insert(0, 'client'); import standalone_engine, runtime_bootstrap, gui"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Prepare bundled OpenVPN runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://build.openvpn.net/downloads/releases/OpenVPN-2.7.6-I001-amd64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'OpenVPN-2.7.6-I001-amd64.msi'
          $stage = Join-Path $env:RUNNER_TEMP 'openvpn-stage'
          $runtime = Join-Path $PWD 'client/runtime'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage,$runtime | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$stage") -Wait -NoNewWindow
          $exe = Get-ChildItem $stage -Recurse -Filter openvpn.exe | Select-Object -First 1
          if (-not $exe) { throw 'Bundled OpenVPN extraction did not contain openvpn.exe' }
          Copy-Item (Join-Path $exe.Directory.FullName '*') $runtime -Recurse -Force
          Get-ChildItem $stage -Recurse -Include *.inf,*.cat,*.sys | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $runtime $_.Name) -Force
          }
          if (-not (Test-Path (Join-Path $runtime 'openvpn.exe'))) { throw 'runtime/openvpn.exe missing' }
          & (Join-Path $runtime 'openvpn.exe') --version

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone Windows executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --uac-admin --paths client --add-data "client/runtime;runtime" --name FinduptoVPN client/app.py

      - name: Smoke-test generated executable metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/FinduptoVPN.exe")) { throw "Build did not produce dist/FinduptoVPN.exe" }
          $size = (Get-Item "dist/FinduptoVPN.exe").Length
          if ($size -lt 1000000) { throw "Generated executable is unexpectedly small: $size bytes" }
          Get-Item "dist/FinduptoVPN.exe" | Select-Object FullName,Length

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v7
        with:
          name: FinduptoVPN-Windows-Standalone
          path: dist/FinduptoVPN.exe
